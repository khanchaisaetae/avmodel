<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - ระบบแสดงโมเดลสามมิติ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hotspot {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .hotspot:hover {
            transform: scale(1.2);
        }
        .hotspot-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        
        #port-detail-modal {
            transition: all 0.3s ease;
        }
        #port-detail-modal.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }
    </style>
</head>

            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minDistance = 0.5;
            controls.maxDistance = 20;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;

            setupLighting();
            setupEnvironment();
            setupHotspotsGroup();
            renderModelButtons();
            loadGLTFModel(models[0]);

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onCanvasClick);
            document.getElementById('btn-reset').addEventListener('click', resetCamera);
            document.getElementById('btn-toggle-grid').addEventListener('click', toggleGrid);
            document.getElementById('btn-toggle-hotspots').addEventListener('click', toggleHotspots);
            document.getElementById('close-modal').addEventListener('click', closePortModal);

            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.5);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.4);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);
        }

        function setupEnvironment() {
            gridHelper = new THREE.GridHelper(20, 20, 0x6366f1, 0x334155);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
            floorPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            floorPlane.rotation.x = -Math.PI / 2;
            floorPlane.position.y = -0.011;
            floorPlane.receiveShadow = true;
            scene.add(floorPlane);
        }

        function setupHotspotsGroup() {
            hotspotsGroup = new THREE.Group();
            scene.add(hotspotsGroup);
        }

        function createHotspotMarkers(hotspotsData) {
            while (hotspotsGroup.children.length > 0) {
                const obj = hotspotsGroup.children[0];
                obj.geometry?.dispose();
                obj.material?.dispose();
                hotspotsGroup.remove(obj);
            }

            hotspotsData.forEach((hotspot, index) => {
                const geometry = new THREE.SphereGeometry(0.08, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: 0xff6b35,
                    transparent: true,
                    opacity: 0.85
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(hotspot.position[0], hotspot.position[1], hotspot.position[2]);
                sphere.userData = { hotspotIndex: index, type: 'hotspot' };
                hotspotsGroup.add(sphere);

                const ringGeometry = new THREE.RingGeometry(0.12, 0.16, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: 0xff6b35,
                    transparent: true,
                    opacity: 0.5,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.position.copy(sphere.position);
                ring.userData = { hotspotIndex: index, type: 'hotspot', isRing: true };
                hotspotsGroup.add(ring);
            });
        }

        function loadGLTFModel(modelInfo) {
            showLoading(true, `กำลังโหลด ${modelInfo.name}...`);

            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else if (child.material) {
                            child.material.dispose();
                        }
                    }
                });
                currentModel = null;
            }

            createHotspotMarkers(modelInfo.hotspots);

            const loader = new THREE.GLTFLoader();
            loader.load(
                modelInfo.url,
                (gltf) => {
                    currentModel = gltf.scene;
                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.side = THREE.DoubleSide;
                            }
                        }
                    });

                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    currentModel.position.x -= center.x;
                    currentModel.position.y -= box.min.y;
                    currentModel.position.z -= center.z;

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.8;
                    cameraZ = Math.max(cameraZ, 2.5);

                    camera.position.set(cameraZ * 0.8, cameraZ * 0.6, cameraZ);
                    controls.target.set(0, size.y / 2, 0);
                    controls.update();

                    scene.add(currentModel);
                    showLoading(false);
                },
                (xhr) => {
                    if (xhr.lengthComputable) {
                        const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingProgress.innerText = `${percentComplete}%`;
                    } else {
                        loadingProgress.innerText = 'กำลังประมวลผล...';
                    }
                },
                (error) => {
                    console.error('Error loading model:', error);
                    loadingText.innerText = 'เกิดข้อผิดพลาดในการโหลดโมเดล';
                    loadingProgress.innerText = 'กรุณาลองใหม่อีกครั้ง';
                    setTimeout(() => showLoading(false), 3000);
                }
            );
        }

        function renderModelButtons() {
            const listContainer = document.getElementById('model-list');
            listContainer.innerHTML = '';
            models.forEach((model) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl transition duration-200 border flex items-center justify-between group ${
                    model.id === activeModelId
                        ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-lg shadow-indigo-500/10'
                        : 'bg-slate-800/60 border-slate-700/60 text-slate-300 hover:bg-slate-700/60 hover:text-white'
                }`;
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="p-2 rounded-lg ${model.id === activeModelId ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-400 group-hover:text-white'} transition-colors">
                            <i class="fa-solid ${model.icon} text-sm w-4 h-4 flex items-center justify-center"></i>
                        </div>
                        <div>
                            <div class="text-xs font-semibold leading-snug">${model.name}</div>
                            <div class="text-[10px] text-slate-400">${model.category}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition-opacity text-indigo-400"></i>
                `;
                btn.onclick = () => {
                    if (activeModelId !== model.id) {
                        activeModelId = model.id;
                        renderModelButtons();
                        loadGLTFModel(model);
                        closePortModal();
                    }
                };
                listContainer.appendChild(btn);
            });
        }

        function showLoading(show, text = 'กำลังโหลดโมเดล 3D...') {
            if (show) {
                loadingText.innerText = text;
                loadingProgress.innerText = '0%';
                loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function resetCamera() {
            if (!currentModel) return;
            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const cameraZ = Math.max(maxDim * 1.8, 2.5);
            camera.position.set(cameraZ * 0.8, cameraZ * 0.6, cameraZ);
            controls.target.set(0, size.y / 2, 0);
            controls.update();
        }

        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
            floorPlane.visible = !floorPlane.visible;
        }

        function toggleHotspots() {
            hotspotsVisible = !hotspotsVisible;
            hotspotsGroup.visible = hotspotsVisible;
            const btnText = document.getElementById('hotspot-btn-text');
            btnText.innerText = hotspotsVisible ? 'ซ่อน Hotspots' : 'แสดง Hotspots';
        }

        function onCanvasClick(event) {
            if (!hotspotsVisible) return;

            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(hotspotsGroup.children, true);

            if (intersects.length > 0) {
                const intersected = intersects[0].object;
                if (intersected.userData.type === 'hotspot') {
                    const hotspotIndex = intersected.userData.hotspotIndex;
                    showPortDetails(hotspotIndex);
                }
            }
        }

        function showPortDetails(hotspotIndex) {
            const activeModel = models.find(m => m.id === activeModelId);
            if (!activeModel || !activeModel.hotspots[hotspotIndex]) return;

            const hotspot = activeModel.hotspots[hotspotIndex];
            document.getElementById('port-title').innerText = hotspot.name;
            document.getElementById('port-subtitle').innerText = activeModel.name;
            document.getElementById('port-icon').className = `fa-solid ${hotspot.icon} text-lg`;

            const detailsContainer = document.getElementById('port-details');
            detailsContainer.innerHTML = '';

            hotspot.details.forEach(detail => {
                const detailDiv = document.createElement('div');
                detailDiv.className = 'flex justify-between items-start py-2 border-b border-slate-700/40 last:border-0';
                detailDiv.innerHTML = `
                    <span class="text-slate-400 font-medium">${detail.label}</span>
                    <span class="text-white text-right max-w-[60%]">${detail.value}</span>
                `;
                detailsContainer.appendChild(detailDiv);
            });

            portModal.classList.remove('hidden');
        }

        function closePortModal() {
            portModal.classList.add('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (hotspotsGroup && hotspotsVisible) {
                hotspotsGroup.children.forEach(child => {
                    if (child.userData.isRing) {
                        child.lookAt(camera.position);
                        const scale = 1 + Math.sin(Date.now() * 0.003) * 0.2;
                        child.scale.set(scale, scale, scale);
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
