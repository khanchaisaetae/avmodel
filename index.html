<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - ระบบแสดงโมเดลสามมิติ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS ปรับแต่งเพิ่มเติม */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom scrollbar for menu */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 select-none">

    <!-- Canvas สำหรับแสดงผล 3D -->
    <div id="canvas-container"></div>

    <!-- แผงควบคุมและเมนูด้านบน/ข้าง -->
    <div class="relative z-10 flex flex-col md:flex-row justify-between items-start p-4 md:p-6 pointer-events-none h-full">
        
        <!-- หัวข้อและโลโก้ -->
        <div class="glass-panel p-4 rounded-2xl shadow-2xl pointer-events-auto max-w-sm w-full mb-4 md:mb-0 border border-slate-700/50">
            <div class="flex items-center space-x-3 mb-2">
                <div class="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid font-bold fa-cube text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">3D Model Viewer</h1>
                    <p class="text-xs text-slate-400">ระบบแสดงผลโมเดลอุปกรณ์สามมิติ</p>
                </div>
            </div>
            
            <hr class="border-slate-700/60 my-3">

            <!-- คำแนะนำการใช้งาน -->
            <div class="space-y-1.5 text-xs text-slate-300">
                <div class="flex items-center space-x-2">
                    <span class="w-6 text-center text-indigo-400"><i class="fa-solid fa-hand-pointer"></i></span>
                    <span><strong>คลิกซ้าย + ลาก:</strong> หมุนมองรอบทิศทาง (360°)</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-6 text-center text-indigo-400"><i class="fa-solid fa-up-down-left-right"></i></span>
                    <span><strong>คลิกขวา + ลาก:</strong> เลื่อนตำแหน่งโมเดล (Pan)</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-6 text-center text-indigo-400"><i class="fa-solid fa-arrows-up-down"></i></span>
                    <span><strong>Scroller / สองนิ้ว:</strong> ย่อ-ขยาย (Zoom)</span>
                </div>
            </div>
        </div>

        <!-- รายการปุ่มเลือกโมเดล -->
        <div class="glass-panel p-4 rounded-2xl shadow-2xl pointer-events-auto w-full md:w-80 border border-slate-700/50 flex flex-col max-h-[calc(100vh-8rem)]">
            <h2 class="text-sm font-semibold mb-3 text-slate-300 uppercase tracking-wider flex items-center">
                <i class="fa-solid fa-list-check mr-2 text-indigo-400"></i> เลือกรายการโมเดล
            </h2>
            
            <div id="model-list" class="space-y-2 overflow-y-auto pr-1 flex-1">
                <!-- ปุ่มโมเดลจะถูกสร้างด้วย JavaScript -->
            </div>

            <!-- ปุ่มเครื่องมือเสริม -->
            <div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-2">
                <button id="btn-reset" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl transition duration-200 flex items-center justify-center space-x-2 border border-slate-700">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>รีเซ็ตมุมมอง</span>
                </button>
                <button id="btn-toggle-grid" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl transition duration-200 flex items-center justify-center space-x-2 border border-slate-700">
                    <i class="fa-solid fa-border-all"></i>
                    <span>ซ่อน/แสดง พื้น</span>
                </button>
            </div>
        </div>
    </div>

    <!-- UI สถานะการโหลด (Loading Screen) -->
    <div id="loading-overlay" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="relative flex items-center justify-center mb-4">
            <div class="w-16 h-16 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <i class="fa-solid fa-cube text-indigo-400 text-xl absolute"></i>
        </div>
        <p id="loading-text" class="text-slate-200 text-sm font-medium">กำลังโหลดโมเดล 3D...</p>
        <p id="loading-progress" class="text-slate-400 text-xs mt-1">0%</p>
    </div>

    <!-- Three.js และโมดูลที่เกี่ยวข้อง -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // รายการโมเดลที่แปลง URL เป็น Raw GitHub แล้ว
        const models = [
            {
                id: 'laptop',
                name: 'Dell G7 Laptop',
                category: 'โน้ตบุ๊ก',
                icon: 'fa-laptop',
                url: 'https://raw.githubusercontent.com/khanchaisaetae/avmodel/main/DellG7-Laptop.gltf'
            },
            {
                id: 'projector',
                name: 'Epson Projector',
                category: 'โปรเจคเตอร์',
                icon: 'fa-video',
                url: 'https://raw.githubusercontent.com/khanchaisaetae/avmodel/main/Epson-Projector.gltf'
            },
            {
                id: 'bluray',
                name: 'Sony Blu-ray Player',
                category: 'เครื่องเล่นบลูเรย์',
                icon: 'fa-compact-disc',
                url: 'https://raw.githubusercontent.com/khanchaisaetae/avmodel/main/Sony-Blu-ray.gltf'
            },
            {
                id: 'tv',
                name: 'Sony Smart TV',
                category: 'สมาร์ททีวี',
                icon: 'fa-tv',
                url: 'https://raw.githubusercontent.com/khanchaisaetae/avmodel/main/Sony-SmartTV.gltf'
            },
            {
                id: 'visualizer',
                name: 'Vertex Visualizer',
                category: 'เครื่องฉายภาพสามมิติ',
                icon: 'fa-camera-retro',
                url: 'https://raw.githubusercontent.com/khanchaisaetae/avmodel/main/Vertex-Visualizer.gltf'
            }
        ];

        // ตัวแปรระบบ 3D
        let scene, camera, renderer, controls;
        let currentModel = null;
        let gridHelper, floorPlane;
        let activeModelId = models[0].id;

        const container = document.getElementById('canvas-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingProgress = document.getElementById('loading-progress');

        // เริ่มต้นสร้างระบบ 3D
        function init() {
            // 1. สร้าง Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

            // 2. สร้าง Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 4);

            // 3. สร้าง Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // 4. ระบบควบคุม OrbitControls (หมุน, ซูม, ย้าย)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minDistance = 0.5;
            controls.maxDistance = 20;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // ป้องกันไม่ให้กล้องมุดใต้พื้นมากเกินไป

            // 5. ระบบแสงสว่าง (Lighting)
            setupLighting();

            // 6. เพิ่มพื้นและเส้น Grid
            setupEnvironment();

            // 7. สร้างรายการปุ่มเลือกโมเดลใน UI
            renderModelButtons();

            // 8. โหลดโมเดลแรก
            loadGLTFModel(models[0]);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('btn-reset').addEventListener('click', resetCamera);
            document.getElementById('btn-toggle-grid').addEventListener('click', toggleGrid);

            // เริ่มการเล่น Animation Loop
            animate();
        }

        // ตั้งค่าแสงสว่าง
        function setupLighting() {
            // แสงสว่างรอบทิศทาง (Ambient)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            // แสงหลักจากด้านบนหน้า (Main Directional Light)
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            // แสงสะท้อนจากด้านหลัง (Fill Light)
            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.5);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);

            // แสงสว่างจากพื้นขึ้นมา (Hemisphere Light)
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.4);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);
        }

        // ตั้งค่าสภาพแวดล้อม (พื้นและกริต)
        function setupEnvironment() {
            // เส้น Grid
            gridHelper = new THREE.GridHelper(20, 20, 0x6366f1, 0x334155);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            // เงาบนพื้น
            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
            floorPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            floorPlane.rotation.x = -Math.PI / 2;
            floorPlane.position.y = -0.011;
            floorPlane.receiveShadow = true;
            scene.add(floorPlane);
        }

        // โหลดโมเดล GLTF
        function loadGLTFModel(modelInfo) {
            showLoading(true, `กำลังโหลด ${modelInfo.name}...`);

            // ลบโมเดลเดิมออกจาก Scene ก่อน
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else if (child.material) {
                            child.material.dispose();
                        }
                    }
                });
                currentModel = null;
            }

            const loader = new THREE.GLTFLoader();

            loader.load(
                modelInfo.url,
                // เมื่อโหลดสำเร็จ
                (gltf) => {
                    currentModel = gltf.scene;

                    // ปรับแต่ง Mesh และเปิดใช้งานเงา
                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            
                            // ปรับแต่งวัสดุหากจำเป็น
                            if (child.material) {
                                child.material.side = THREE.DoubleSide;
                            }
                        }
                    });

                    // คำนวณขนาด Bounding Box เพื่อจัดวางโมเดลให้อยู่ตรงกลางและปรับขนาดให้อยู่ในสเกลที่พอดี
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    // จัดให้ฐานโมเดลวางอยู่บนพื้น y = 0
                    currentModel.position.x -= center.x;
                    currentModel.position.y -= box.min.y;
                    currentModel.position.z -= center.z;

                    // คำนวณระยะกล้องที่เหมาะสมตามขนาดโมเดล
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.8;
                    
                    cameraZ = Math.max(cameraZ, 2.5); // ระยะขั้นต่ำ

                    // ปรับตำแหน่งกล้องแบบนุ่มนวล
                    camera.position.set(cameraZ * 0.8, cameraZ * 0.6, cameraZ);
                    controls.target.set(0, size.y / 2, 0);
                    controls.update();

                    scene.add(currentModel);
                    showLoading(false);
                },
                // ความคืบหน้าการโหลด
                (xhr) => {
                    if (xhr.lengthComputable) {
                        const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingProgress.innerText = `${percentComplete}%`;
                    } else {
                        loadingProgress.innerText = 'กำลังประมวลผล...';
                    }
                },
                // กรณีเกิดข้อผิดพลาด
                (error) => {
                    console.error('Error loading model:', error);
                    loadingText.innerText = 'เกิดข้อผิดพลาดในการโหลดโมเดล';
                    loadingProgress.innerText = 'กรุณาลองใหม่อีกครั้ง';
                    setTimeout(() => showLoading(false), 3000);
                }
            );
        }

        // สร้างปุ่มเลือกโมเดล
        function renderModelButtons() {
            const listContainer = document.getElementById('model-list');
            listContainer.innerHTML = '';

            models.forEach((model) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl transition duration-200 border flex items-center justify-between group ${
                    model.id === activeModelId 
                        ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-lg shadow-indigo-500/10' 
                        : 'bg-slate-800/60 border-slate-700/60 text-slate-300 hover:bg-slate-700/60 hover:text-white'
                }`;
                
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="p-2 rounded-lg ${model.id === activeModelId ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-400 group-hover:text-white'} transition-colors">
                            <i class="fa-solid ${model.icon} text-sm w-4 h-4 flex items-center justify-center"></i>
                        </div>
                        <div>
                            <div class="text-xs font-semibold leading-snug">${model.name}</div>
                            <div class="text-[10px] text-slate-400">${model.category}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 transition-opacity text-indigo-400"></i>
                `;

                btn.onclick = () => {
                    if (activeModelId !== model.id) {
                        activeModelId = model.id;
                        renderModelButtons(); // อัปเดตสถานะปุ่ม
                        loadGLTFModel(model);
                    }
                };

                listContainer.appendChild(btn);
            });
        }

        // แสดง/ซ่อน Overlay การโหลด
        function showLoading(show, text = 'กำลังโหลดโมเดล 3D...') {
            if (show) {
                loadingText.innerText = text;
                loadingProgress.innerText = '0%';
                loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // รีเซ็ตมุมมองกล้อง
        function resetCamera() {
            if (!currentModel) return;

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const cameraZ = Math.max(maxDim * 1.8, 2.5);

            // Animated transition using GSAP-like smooth damp in update loop
            camera.position.set(cameraZ * 0.8, cameraZ * 0.6, cameraZ);
            controls.target.set(0, size.y / 2, 0);
            controls.update();
        }

        // เปิด/ปิด การแสดงผลกริตพื้น
        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
            floorPlane.visible = !floorPlane.visible;
        }

        // ปรับขนาดหน้าจออัตโนมัติ
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Loop การแสดงผล 3D
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // เริ่มต้นทำงานเมื่อโหลด DOM เรียบร้อย
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
